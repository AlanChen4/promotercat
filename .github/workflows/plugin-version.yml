name: Update plugin version

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "plugins/promotercat/**"
      - "scripts/plugin-version.ts"
      - ".github/workflows/plugin-version.yml"

permissions:
  contents: read

concurrency:
  group: plugin-version-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update:
    # Fork PR tokens cannot write to their source branch. Contributors can use
    # the same script locally; do not execute fork code with privileged events.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Synchronize the release version
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/plugin-version.ts auto "$BASE_REF"
      - name: Commit version changes to the PR
        run: |
          git add plugins/promotercat/plugin.json plugins/promotercat/.claude-plugin/plugin.json plugins/promotercat/mcp.json plugins/promotercat/.mcp.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump PromoterCat plugin version"
          git push
